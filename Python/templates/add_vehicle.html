{% extends "base.html" %}
{% block title %}Fahrzeug hinzufügen · Vehicle Manager{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1>Fahrzeug hinzufügen</h1>
        <p>Stammdaten und technische Angaben erfassen.</p>
    </div>
</div>
<div class="card">
    <form method="post">
        {% set vehicle = none %}
        {% include "_vehicle_fields.html" %}
        <div class="actions" style="margin-top: 24px">
            <button class="btn btn-primary" type="submit">Fahrzeug anlegen</button>
            <a class="btn btn-secondary" href="{{ url_for('index') }}">Abbrechen</a>
        </div>
    </form>
</div>
{% endblock %}
